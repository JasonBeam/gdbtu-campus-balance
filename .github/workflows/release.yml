name: Release downloads
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to verify, e.g. v0.2.0-candidate8'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test_scriptable.cjs
      - run: node tests/test_export.cjs
      - name: Test onboarding when present
        run: if test -f tests/test_onboarding.cjs; then node tests/test_onboarding.cjs; fi
      - name: Verify existing release or publish new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" >/dev/null 2>release-error.txt; then
            mkdir -p release-downloads
            gh release download "$RELEASE_TAG" --dir release-downloads
            cd release-downloads
            test -f "campus-balance-${RELEASE_TAG}.js"
            test -f "gdbtu-campus-balance-${RELEASE_TAG}-scriptable.zip"
            test -f "gdbtu-campus-balance-${RELEASE_TAG}-source.zip"
            test -f SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            echo 'Existing release verified; attachments were not modified.'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            cat release-error.txt >&2
            echo 'Manual verification requires an existing release.' >&2
            exit 1
          elif grep -q 'HTTP 404' release-error.txt; then
            notes="docs/releases/$RELEASE_TAG.md"
            test -f "$notes"
            python3 tools/build_release.py "$RELEASE_TAG"
            (cd dist && sha256sum -c SHA256SUMS.txt)
            flags=()
            if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "$RELEASE_TAG" --notes-file "$notes" "${flags[@]}"
          else
            cat release-error.txt >&2
            exit 1
          fi
